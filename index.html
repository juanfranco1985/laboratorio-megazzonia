<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laboratorio Megazzonia</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #172024;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(760px, calc(100vw - 32px));
        padding: 32px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 6vw, 4rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 24px;
        color: #52616b;
        line-height: 1.6;
      }

      nav {
        display: grid;
        gap: 12px;
      }

      a {
        display: block;
        padding: 18px;
        border: 1px solid rgba(23, 32, 36, 0.14);
        border-radius: 8px;
        background: #ffffff;
        color: #1f5f8b;
        font-weight: 700;
        text-decoration: none;
      }

      span {
        display: block;
        margin-top: 6px;
        color: #52616b;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Laboratorio Megazzonia</h1>
      <p>Indice publico de recursos publicados en GitHub Pages.</p>
      <nav aria-label="Recursos publicados">
        <a href="certificados/">Certificados<span>Certificaciones con datos sensibles redactados.</span></a>
        <a href="proyectos-analisis-datos/">Proyectos de analisis de datos<span>Portfolio interactivo de proyectos analiticos, prompts y fichas tecnicas.</span></a>
      </nav>
    </main>
  </body>
</html>
