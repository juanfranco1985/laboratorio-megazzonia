<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />

    <meta property="og:title" content="Laboratorio Megazzonia | Portfolio tecnico" />
    <meta property="og:description" content="Casos tecnicos, demos interactivas y proyectos insignia organizados en un portfolio navegable." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="portfolio/assets/screenshots/cases/home-con-destacados.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Laboratorio Megazzonia | Portfolio tecnico" />
    <meta name="twitter:description" content="Simuladores, dashboards, demos 3D y aplicaciones Android con evidencia visual." />
    <meta name="twitter:image" content="portfolio/assets/screenshots/cases/home-con-destacados.png" />
    <meta name="theme-color" content="#07110f" />
    <title>Laboratorio Megazzonia | Portfolio tecnico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif;
        background: #07110f;
        color: #ffffff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        background:
          radial-gradient(circle at 50% 44%, #16231f 0%, #07110f 56%, #030706 100%);
      }

      main {
        width: min(560px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.055);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(22px);
      }

      h1 {
        margin: 0 0 8px;
        font-family: "Orbitron", sans-serif;
      }

      p {
        margin: 0 0 16px;
        color: #aec5bd;
      }

      a {
        display: inline-flex;
        padding: 10px 13px;
        border: 1px solid rgba(0, 255, 170, 0.36);
        border-radius: 10px;
        background: rgba(0, 255, 170, 0.12);
        color: #00ffaa;
        font-weight: 700;
        text-decoration: none;
      }

      code {
        display: inline-block;
        padding: 3px 6px;
        background: rgba(0, 0, 0, 0.34);
        border: 1px solid rgba(0, 255, 170, 0.18);
        color: #d9fff1;
        font-family: "Share Tech Mono", monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Laboratorio Megazzonia</h1>
      <p id="statusText">Preparando apertura del portafolio.</p>
      <p id="fileHelp" hidden>
        Este proyecto necesita abrirse por <code>http://</code>, no por <code>file://</code>.
        Ejecuta <code>abrir-laboratorio.bat</code> o <code>cmd /c npm.cmd run dev</code> desde esta carpeta.
      </p>
      <a id="portfolioLink" href="./LABORATORIO%20MEGAZZONIA%20estructura%20blog/android/app/src/main/assets/index.html?portfolio=20260513a#home">Abrir portafolio</a>
    </main>
    <script>
      const target = "./LABORATORIO%20MEGAZZONIA%20estructura%20blog/android/app/src/main/assets/index.html?portfolio=20260513a#home";
      if (window.location.protocol === "file:") {
        document.getElementById("statusText").textContent = "No abras este archivo directo: el navegador bloquea los modulos JavaScript por CORS.";
        document.getElementById("fileHelp").hidden = false;
        document.getElementById("portfolioLink").href = "http://127.0.0.1:8090/";
      } else {
        window.location.replace(target);
      }
    </script>
  </body>
</html>
