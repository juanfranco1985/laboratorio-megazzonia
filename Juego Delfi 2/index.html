<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Juego Delfi 2: aventura de plataformas para un jugador a través de siete mundos." />
    <title>Juego Delfi 2 — Los siete portales</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div><span class="eyebrow">Megazzonia Lab</span><h1>Juego Delfi 2</h1></div>
        <p>Aventura dimensional para un jugador</p>
      </header>
      <section class="game-frame" aria-label="Juego de plataformas Juego Delfi 2">
        <div id="game" role="application" aria-label="Área de juego"></div>
        <div class="touch-controls" aria-label="Controles táctiles">
          <div class="touch-group">
            <button data-control="left" aria-label="Mover a la izquierda">◀</button>
            <button data-control="right" aria-label="Mover a la derecha">▶</button>
          </div>
          <div class="touch-group actions">
            <button data-control="switch" aria-label="Cambiar héroe">C</button>
            <button data-control="power" class="power" aria-label="Usar poder">✦</button>
            <button data-control="jump" class="jump" aria-label="Saltar">▲</button>
            <button data-control="pause" aria-label="Pausa">Ⅱ</button>
          </div>
        </div>
      </section>
      <footer>
        <span>Teclado: WASD/Flechas · Espacio saltar · X poder · F cambiar poder · C cambiar héroe · Esc pausa</span>
        <span>Joystick: A saltar · X/B poder · Y cambiar héroe · LB/RB poder · Start pausa</span>
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
