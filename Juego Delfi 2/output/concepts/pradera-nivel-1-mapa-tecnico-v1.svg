<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07172a"/><stop offset="1" stop-color="#241445"/></linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#31cce8"/><stop offset="1" stop-color="#176ea8"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ffe18a"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font:700 34px Georgia,serif;fill:#ffe7a8}.sub{font:600 17px Arial,sans-serif;fill:#9cefff;letter-spacing:2px}
      .zoneTitle{font:700 24px Georgia,serif;fill:#fff0b0}.label{font:600 16px Arial,sans-serif;fill:#e7eeff}
      .small{font:14px Arial,sans-serif;fill:#b9c9e9}.panel{fill:#0d1837;stroke:#75e9ff;stroke-width:3}
      .node{fill:#18234c;stroke:#9b7cff;stroke-width:2}.route{fill:none;stroke:#ffe18a;stroke-width:4;marker-end:url(#arrow)}
      .optional{fill:none;stroke:#80e7c4;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="52" text-anchor="middle" class="title">PRADERA · MAPA TÉCNICO DEL NIVEL 1</text>
  <text x="800" y="82" text-anchor="middle" class="sub">BOTE → TRONCO → MOLINO → HENO → PORTAL</text>

  <rect x="55" y="112" width="1490" height="150" rx="22" class="panel"/>
  <rect x="82" y="154" width="150" height="62" rx="14" class="node"/><text x="157" y="191" text-anchor="middle" class="label">LLEGADA</text>
  <path d="M232 185H312" class="route"/>
  <rect x="312" y="154" width="160" height="62" rx="31" fill="url(#river)" stroke="#b9fbff" stroke-width="2"/><text x="392" y="191" text-anchor="middle" class="label">BOTE DE IDA</text>
  <path d="M472 185H555" class="route"/>
  <rect x="555" y="135" width="220" height="100" rx="16" class="node"/><text x="665" y="176" text-anchor="middle" class="zoneTitle">TRONCO</text><text x="665" y="204" text-anchor="middle" class="small">interior vertical · gema 1</text>
  <path d="M775 185H850" class="route"/>
  <rect x="850" y="154" width="170" height="62" rx="31" fill="url(#river)" stroke="#b9fbff" stroke-width="2"/><text x="935" y="191" text-anchor="middle" class="label">BOTE REGRESO</text>
  <path d="M1020 185H1095" class="route"/>
  <rect x="1095" y="135" width="190" height="100" rx="16" class="node"/><text x="1190" y="176" text-anchor="middle" class="zoneTitle">MOLINO</text><text x="1190" y="204" text-anchor="middle" class="small">2 rutas · gema 2</text>
  <path d="M1285 185H1355" class="route"/>
  <rect x="1355" y="135" width="160" height="100" rx="16" class="node"/><text x="1435" y="176" text-anchor="middle" class="zoneTitle">HENO</text><text x="1435" y="204" text-anchor="middle" class="small">laberinto · gema 3</text>

  <rect x="55" y="300" width="470" height="510" rx="24" class="panel"/>
  <text x="290" y="342" text-anchor="middle" class="zoneTitle">1 · ESTRUCTURA DEL TRONCO</text>
  <rect x="93" y="706" width="155" height="58" rx="12" class="node"/><text x="171" y="740" text-anchor="middle" class="label">MUELLE RAÍCES</text>
  <rect x="291" y="682" width="185" height="82" rx="12" class="node"/><text x="383" y="718" text-anchor="middle" class="label">TRONCO HUECO</text><text x="383" y="743" text-anchor="middle" class="small">entrada interior</text>
  <path d="M248 735H291" class="route"/>
  <rect x="291" y="572" width="185" height="70" rx="12" class="node"/><text x="383" y="603" text-anchor="middle" class="label">CÁMARA RAÍCES</text><text x="383" y="625" text-anchor="middle" class="small">Caracol</text>
  <path d="M383 682V642" class="route"/>
  <rect x="95" y="494" width="185" height="70" rx="12" class="node"/><text x="187" y="525" text-anchor="middle" class="label">POZO VERTICAL</text><text x="187" y="547" text-anchor="middle" class="small">corteza + rama móvil</text>
  <path d="M291 607H250Q187 607 187 564" class="route"/>
  <rect x="291" y="406" width="185" height="70" rx="12" class="node"/><text x="383" y="437" text-anchor="middle" class="label">CÁMARA SAVIA</text><text x="383" y="459" text-anchor="middle" class="small">limo · corazón opcional</text>
  <path d="M187 494V455Q187 441 205 441H291" class="route"/>
  <rect x="95" y="360" width="155" height="65" rx="12" class="node"/><text x="172" y="389" text-anchor="middle" class="label">BALCÓN</text><text x="172" y="410" text-anchor="middle" class="small">salida superior</text>
  <path d="M291 441H270Q250 441 250 407" class="route"/>
  <circle cx="383" cy="380" r="31" fill="#50dbff" stroke="#fff" stroke-width="3" filter="url(#glow)"/><text x="383" y="386" text-anchor="middle" class="label">G1</text>
  <path d="M250 380H352" class="route"/>

  <rect x="565" y="300" width="470" height="510" rx="24" class="panel"/>
  <text x="800" y="342" text-anchor="middle" class="zoneTitle">2 · MOLINO DEL CHECKPOINT</text>
  <rect x="714" y="704" width="172" height="60" rx="12" class="node"/><text x="800" y="730" text-anchor="middle" class="label">BASE + CHECKPOINT</text><text x="800" y="751" text-anchor="middle" class="small">elección de ruta</text>
  <rect x="606" y="585" width="178" height="78" rx="12" class="node"/><text x="695" y="615" text-anchor="middle" class="label">INTERIOR</text><text x="695" y="638" text-anchor="middle" class="small">vigas · engranajes</text>
  <rect x="816" y="585" width="178" height="78" rx="12" class="node"/><text x="905" y="615" text-anchor="middle" class="label">EXTERIOR</text><text x="905" y="638" text-anchor="middle" class="small">escalera · aspas</text>
  <path d="M780 704Q745 680 710 663" class="optional"/><path d="M820 704Q855 680 890 663" class="route"/>
  <rect x="660" y="462" width="280" height="72" rx="12" class="node"/><text x="800" y="493" text-anchor="middle" class="label">TERRAZA DE CONVERGENCIA</text><text x="800" y="516" text-anchor="middle" class="small">ambas rutas llegan aquí</text>
  <path d="M695 585Q710 540 750 534" class="optional"/><path d="M905 585Q890 540 850 534" class="route"/>
  <circle cx="800" cy="398" r="34" fill="#9a78ff" stroke="#fff" stroke-width="3" filter="url(#glow)"/><text x="800" y="404" text-anchor="middle" class="label">G2</text>
  <path d="M800 462V432" class="route"/>
  <text x="800" y="790" text-anchor="middle" class="small">Gema 2 despliega la rampa hacia el henal</text>

  <rect x="1075" y="300" width="470" height="510" rx="24" class="panel"/>
  <text x="1310" y="342" text-anchor="middle" class="zoneTitle">3 · LABERINTO DE HENO</text>
  <rect x="1112" y="390" width="185" height="68" rx="12" class="node"/><text x="1204" y="419" text-anchor="middle" class="label">RAMPA DE ENTRADA</text><text x="1204" y="441" text-anchor="middle" class="small">desde el molino</text>
  <rect x="1327" y="390" width="175" height="68" rx="12" class="node"/><text x="1414" y="419" text-anchor="middle" class="label">PASILLO ALTO</text><text x="1414" y="441" text-anchor="middle" class="small">fardos normales</text>
  <path d="M1297 424H1327" class="route"/>
  <rect x="1327" y="502" width="175" height="70" rx="12" class="node"/><text x="1414" y="533" text-anchor="middle" class="label">CÁMARA REBOTE</text><text x="1414" y="555" text-anchor="middle" class="small">dos fardos elásticos</text>
  <path d="M1414 458V502" class="route"/>
  <rect x="1112" y="502" width="185" height="70" rx="12" class="node"/><text x="1204" y="533" text-anchor="middle" class="label">PASILLO LIMO</text><text x="1204" y="555" text-anchor="middle" class="small">lento → daño</text>
  <path d="M1327 537H1297" class="route"/>
  <rect x="1194" y="622" width="230" height="78" rx="12" class="node"/><text x="1309" y="653" text-anchor="middle" class="label">NÚCLEO DEL HENAL</text><text x="1309" y="676" text-anchor="middle" class="small">Escarabajo · gema 3</text>
  <path d="M1204 572Q1215 610 1250 622" class="route"/>
  <circle cx="1459" cy="661" r="32" fill="#ff6f98" stroke="#fff" stroke-width="3" filter="url(#glow)"/><text x="1459" y="667" text-anchor="middle" class="label">G3</text>
  <path d="M1424 661H1427" class="route"/>
  <rect x="1112" y="733" width="397" height="48" rx="12" fill="#382163" stroke="#ffe18a" stroke-width="3"/><text x="1310" y="763" text-anchor="middle" class="label">SALIDA ABIERTA → JARDÍN DEL PORTAL</text>
  <path d="M1309 700V733" class="route"/>

  <rect x="1230" y="830" width="18" height="18" transform="rotate(45 1239 839)" fill="#ffe18a"/><text x="1260" y="845" class="small">ruta obligatoria</text>
  <line x1="1380" y1="839" x2="1420" y2="839" stroke="#80e7c4" stroke-width="3" stroke-dasharray="8 6"/><text x="1432" y="845" class="small">ruta alternativa</text>
</svg>
